<body class="cmpl-404-page">

  <main
    class="error-page"
    id="main-content">


    <section
      class="error-stage"
      aria-labelledby="error-title">


      <!-- =================================================
           MESSAGE
      ================================================== -->

      <div class="error-message">

        <p class="error-kicker">
          404 PAGE NOT FOUND
        </p>


        <h1
          class="error-title"
          id="error-title">
          OOPS! You’ve hit a <br> dead end.
        </h1>

      </div>


      <!-- =================================================
           COUNTDOWN
      ================================================== -->

      <div class="error-countdown">


        <div class="error-countdown__meta">

          <span class="error-countdown__label">
            Taking you home in
          </span>


          <span
            class="error-countdown__progress"
            aria-hidden="true">

            <span
              class="error-countdown__progress-fill"
              data-countdown-progress>
            </span>

          </span>

        </div>


        <div
          class="error-countdown__number"
          data-countdown
          aria-live="polite"
          aria-atomic="true">
          05
        </div>


      </div>


    </section>

  </main>


  <!-- ===================================================
       EXISTING PORTFOLIO CURSOR
  ==================================================== -->

    class="custom-cursor"
    aria-hidden="true">
  </div>
