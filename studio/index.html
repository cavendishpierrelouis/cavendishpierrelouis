<body class="studio-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="top"></div>

  <div class="studio-binary" aria-hidden="true" data-binary-field></div>

  <header class="studio-header" data-header>
    <div class="studio-header__inner">
      <div class="studio-header__meta">
        <button
          class="theme-toggle"
          type="button"
          aria-label="Light mode"
          title="Light mode"
          data-theme-toggle>
          <!-- Shown in light mode -->
          <img
            class="theme-icon theme-icon--dark"
            src="https://www.cavendishpierrelouis.io/assets/icons/home/dark-mode-night-moon-svgrepo-com.svg"
            alt=""
            width="20"
            height="20"
            aria-hidden="true">

          <!-- Shown in dark mode -->
          <img
            class="theme-icon theme-icon--light"
            src="https://www.cavendishpierrelouis.io/assets/icons/home/light-mode-svgrepo-com.svg"
            alt=""
            width="20"
            height="20"
            aria-hidden="true">
        </button>

        <button
          class="studio-motion-toggle"
          type="button"
          aria-label="Pause background animation"
          aria-pressed="false"
          title="Pause background animation"
          data-binary-toggle>
          <img
            class="studio-motion-icon studio-motion-icon--pause"
            src="https://www.cavendishpierrelouis.io/assets/icons/home/pause-svgrepo-com.svg"
            alt=""
            width="18"
            height="18"
            aria-hidden="true">

          <img
            class="studio-motion-icon studio-motion-icon--play"
            src="https://www.cavendishpierrelouis.io/assets/icons/home/play-svgrepo-com.svg"
            alt=""
            width="18"
            height="18"
            aria-hidden="true">
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" class="studio-main">
    <section class="studio-welcome" aria-labelledby="studio-title">
      <div class="studio-welcome__content">
        <img
          class="studio-welcome__icon"
          src="https://www.cavendishpierrelouis.io/assets/icons/home/collaborate-svgrepo-com.svg"
          alt=""
          width="22"
          height="22"
          aria-hidden="true"
          data-prelude-item>
<br>
        <h1
          class="studio-title"
          id="studio-title"
          aria-label="Welcome to my studio">
          <span class="studio-title__line" aria-hidden="true">
            <span data-typewriter-line="welcome"></span><span class="studio-title__caret studio-title__caret--first" aria-hidden="true"></span>
          </span>
          <span class="studio-title__line" aria-hidden="true">
            <span data-typewriter-line="studio"></span><span class="studio-title__caret studio-title__caret--second" aria-hidden="true"></span>
          </span>
        </h1>

      <br><br>
        <div class="studio-actions" data-intro-item>
          <a
            class="button button--primary"
            href="work.html"
            data-enter-studio>
            Enter
          </a>

          <a
            class="text-link studio-leave"
            href="https://www.cavendishpierrelouis.io/">
            <span class="studio-leave__label">Leave</span>
            <img
              src="assets/icons/leave-svgrepo-com.svg"
              alt=""
              width="18"
              height="18"
              aria-hidden="true">
          </a>
        </div>
      </div>
    </section>
  </main>
