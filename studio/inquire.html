  <main
    id="main-content"
    class="inquire-main">

    <section
      class="inquire-layout"
      aria-labelledby="inquire-title">

      <div
        class="inquire-visual"
        aria-hidden="true">

        <img
          src="assets/projects/contact.PNG"
          alt=""
          width="1200"
          height="1600"
          fetchpriority="high"
          decoding="async">
      </div>

      <div class="inquire-panel">

        <div class="inquire-panel__theme">

          <button
            class="theme-toggle work-theme-toggle inquire-theme-toggle"
            type="button"
            aria-label="Light mode"
            title="Light mode"
            data-theme-toggle>

            <img
              class="theme-icon theme-icon--dark"
              src="https://www.cavendishpierrelouis.io/assets/icons/home/dark-mode-night-moon-svgrepo-com.svg"
              alt=""
              width="20"
              height="20"
              aria-hidden="true">

            <img
              class="theme-icon theme-icon--light"
              src="https://www.cavendishpierrelouis.io/assets/icons/home/light-mode-svgrepo-com.svg"
              alt=""
              width="20"
              height="20"
              aria-hidden="true">
          </button>

        </div>

        <div class="inquire-panel__inner">

          <div class="inquire-intro">

            <div class="inquire-heading-row">

              <h1
                class="inquire-title"
                id="inquire-title">
                Let's talk
              </h1>

              <a
                class="inquire-book-link"
                href="https://calendar.app.google/g3thC4PXvPacjcqeA"
                aria-label="Book a call">

                <span>Prefer a call? Book a time</span>

                <span
                  class="inquire-book-link__icon"
                  aria-hidden="true">

                  <img
                    src="assets/icons/go-svgrepo-com.svg"
                    alt=""
                    width="16"
                    height="16">
                </span>

              </a>
            </div>
          </div>

<br><br>

          <form
            class="inquire-form"
            action="/api/inquiry"
            method="POST"
            novalidate
            data-inquire-form
            data-cmpl-form
            data-form-endpoint="/api/inquiry">

            <div class="inquire-form__honeypot" aria-hidden="true">
              <label for="inquire-website">Website</label>
              <input
                id="inquire-website"
                name="_website"
                type="text"
                tabindex="-1"
                autocomplete="off">
            </div>

            <div class="inquire-form__grid">

              <div class="inquire-field">

                <label for="inquire-name">
                  Full Name
                </label>

                <input
                  id="inquire-name"
                  name="name"
                  type="text"
                  autocomplete="name"
                  placeholder="Your name"
                  required>
              </div>

              <div class="inquire-field">

                <label for="inquire-email">
                  Email
                </label>

                <input
                  id="inquire-email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  inputmode="email"
                  placeholder="you@example.com"
                  required>
              </div>

              <div class="inquire-field">

                <label for="inquire-project">
                  Project
                </label>

                <input
                  id="inquire-project"
                  name="project"
                  type="text"
                  placeholder="Website, software, or brand"
                  required>
              </div>

              <div class="inquire-field">

                <label for="inquire-budget">
                  Budget
                </label>

                <select
                  id="inquire-budget"
                  name="budget"
                  required>

                  <option
                    value=""
                    selected
                    disabled>
                    Select a range
                  </option>

                  <option value="Not sure yet">
                    Not sure yet
                  </option>

                  <option value="Under $2,500">
                    Under $2,500
                  </option>

                  <option value="$2,500–$5,000">
                    $2,500–$5,000
                  </option>

                  <option value="$5,000–$10,000">
                    $5,000–$10,000
                  </option>

                  <option value="$10,000+">
                    $10,000+
                  </option>

                </select>
              </div>

              <div class="inquire-field inquire-field--message">

                <label for="inquire-message">
                  Write your message
                </label>

                <textarea
                  id="inquire-message"
                  name="message"
                  rows="6"
                  placeholder="Hi Cavendish,"
                  required></textarea>
              </div>

            </div>

            <label class="inquire-consent">

              <input
                type="checkbox"
                name="consent"
                required>

              <span>
                I agree that my information may be used to reply to this message.
              </span>

            </label>

<br>

            <div class="inquire-form__actions">

              <div
                class="cf-turnstile"
                id="inquire-turnstile"
                data-sitekey="0x4AAAAAAER4Nfs6k4QgnH7q"
                data-theme="auto"
                data-appearance="interaction-only"></div>

              <button
                class="button button--primary inquire-submit"
                type="submit">
                Send message
              </button>

              <p
                class="inquire-form__status"
                role="status"
                aria-live="polite"
                data-inquire-status>
              </p>

            </div>
          </form>
        </div>
      </div>
    </section>
  </main>
